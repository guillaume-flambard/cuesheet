<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuesheet Mission Control</title>
<style>
:root{color-scheme:light dark;--bg:var(--color-background-primary,#fff);--fg:var(--color-text-primary,#202a35);--muted:var(--color-text-secondary,#536172);--line:var(--color-border-primary,#dce1e7);--accent:#245cb3;--attention:#855400;--soft:#f2f5f9;font-family:var(--font-sans,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif)}
:root[data-theme=dark]{--bg:var(--color-background-primary,#171c24);--fg:var(--color-text-primary,#edf1f6);--muted:var(--color-text-secondary,#adb8c7);--line:var(--color-border-primary,#384252);--accent:#9bbcff;--attention:#e4bc7d;--soft:#232b37}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}main{max-width:840px;margin:auto;padding:24px 28px}header{display:flex;justify-content:space-between;gap:18px;align-items:baseline}h1{font-size:16px;font-weight:600;margin:0}h2{font-size:24px;line-height:1.35;font-weight:550;letter-spacing:-.45px;margin:18px 0 20px}h3{font-size:14px;font-weight:650;margin:24px 0 10px}p{font-size:14px;line-height:1.6;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.muted,small{color:var(--muted)}.status{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}.attention{color:var(--attention)}.verified{color:var(--accent)}.notice{border-left:3px solid var(--attention);padding:6px 0 6px 14px;margin:18px 0}.facts{display:flex;gap:18px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;margin-top:20px;font-size:13px;color:var(--muted)}nav{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;margin-top:20px}button{font:inherit;font-size:13px;color:var(--fg);border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 12px;cursor:pointer}button[aria-current=true]{background:var(--soft);border-color:var(--muted)}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.row{padding:11px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;font-size:13px;line-height:1.6;overflow-wrap:anywhere}.row small{display:block}#connection{font-size:12px;margin-top:14px}ul{padding-left:18px;font-size:14px;line-height:1.7}code{font-size:12px;overflow-wrap:anywhere;white-space:pre-wrap}details{margin-top:15px;font-size:13px}summary{cursor:pointer}section[hidden]{display:none}@media(max-width:420px){main{padding:18px 16px}h2{font-size:21px}header{gap:10px}.row{grid-template-columns:1fr}.facts{gap:12px}}
</style></head><body><main aria-label="Cuesheet mission"><header><h1 id="project">Cuesheet</h1><span class="status" id="status">Not connected</span></header><h2 id="objective">Waiting for a mission</h2><section id="card"><p id="action" class="muted">Ask your assistant to inspect or start a Cuesheet mission.</p><p id="phase" class="muted"></p><div id="facts" class="facts"></div></section><section id="inspector" hidden></section><section id="delta" hidden></section><nav aria-label="Mission views"><button id="cardButton" aria-current="true">Mission</button><button id="inspectButton">Inspect</button><button id="deltaButton">Human delta</button><button id="refreshButton">Refresh</button></nav><p id="connection" role="status" class="muted">Connecting to the host…</p></main><!-- BUNDLE --></body></html>
